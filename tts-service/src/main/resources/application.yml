server:
  port: 8832

spring:
  application:
    name: tts-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}/tts_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8760/eureka}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

tts:
  edge-base-url: ${EDGE_TTS_BASE_URL:http://localhost:5000}
  default-voice: ${TTS_DEFAULT_VOICE:es-MX-DaliaNeural}
  default-rate: ${TTS_DEFAULT_RATE:1.0}
  cache-dir: ${TTS_CACHE_DIR:/data/tts-cache}
  voices-sync-cron: "0 0 3 * * *"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info
