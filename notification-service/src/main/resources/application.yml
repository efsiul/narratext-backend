server:
  port: 8834

spring:
  application:
    name: notification-service
  config:
    import: optional:file:.env[.properties]
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8760/eureka}
  instance:
    prefer-ip-address: true

notification:
  mail:
    from: ${MAIL_FROM}

management:
  endpoints:
    web:
      exposure:
        include: health,info
