server:
  port: 8820

spring:
  application:
    name: gateway-service
  config:
    import: optional:file:.env[.properties]
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-headers: "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allow-credentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: library-service
          uri: lb://library-service
          predicates:
            - Path=/api/v1/library/**
        - id: reading-service
          uri: lb://reading-service
          predicates:
            - Path=/api/v1/reading/**
        - id: tts-service
          uri: lb://tts-service
          predicates:
            - Path=/api/v1/tts/**
        - id: social-service
          uri: lb://social-service
          predicates:
            - Path=/api/v1/social/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8760/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
